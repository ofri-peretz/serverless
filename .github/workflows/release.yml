# Release workflow — Changesets-driven publish for the @interlace/serverless monorepo.
#
# Auth modes (BOTH are wired; the workflow works under either):
#
#   1. FIRST-TIMER (NPM_TOKEN):
#      Set repository secret `NPM_TOKEN` to a Granular Access Token from
#      https://npmjs.com/settings/~/tokens. This is the path for the very
#      first publish, before the npm org has a Trusted Publisher configured.
#      See `.github/NPM_SETUP_QUICK_REFERENCE.md`.
#
#   2. TRUSTED PUBLISHING / OIDC (preferred, no secrets):
#      After the first publish, configure GitHub OIDC as a trusted publisher
#      on the `@interlace` npm org. The `id-token: write` permission below
#      lets the workflow request OIDC tokens; `changesets/action` and
#      `npm publish` pick them up automatically. NPM_TOKEN can be deleted
#      after this is set up. See `.github/TRUSTED_PUBLISHING_SETUP.md`.
#
# Both packages declare `"publishConfig": { "access": "public" }` so the
# first publish lands as public — no `--access public` flag needed in CI.

name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # for changesets to push the version-bump commit + open the Release PR
  pull-requests: write # for changesets to manage the Release PR
  id-token: write # for npm OIDC (Trusted Publishing) — harmless when using NPM_TOKEN

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: 🔨 Build all packages
        run: npx turbo run build

      - name: 🧪 Test all packages
        run: npx turbo run test

      - name: 📦 Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🏷️ Tag published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "## 📦 Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "- **\(.name)** → `\(.version)`"' >> $GITHUB_STEP_SUMMARY

      - name: ✅ No pending changesets
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.changesets.outputs.published != 'true'
        run: echo "✅ No pending changesets — nothing to release"
