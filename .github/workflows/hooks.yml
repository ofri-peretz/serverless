# The shared gates from burgee's reusable workflows: the git hooks match the hookset presets this
# repo pins, and a PR that changes a package ships a changeset (`skip-changeset` opts out).
name: Shared gates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hookset:
    uses: ofri-peretz/burgee/.github/workflows/hookset-check.yml@hookset@1.3.0
  changeset:
    uses: ofri-peretz/burgee/.github/workflows/changeset-gate.yml@hookset@1.3.0
    with:
      paths: '^packages/[^/]+/(src|package\.json)'
