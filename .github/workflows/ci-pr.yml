name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '!README.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Fast gate — oxlint (~200ms) + format check
  # oxlint is scoped to turbo-affected workspaces (per-package lint:oxlint
  # tasks), so only changed packages are linted. fetch-depth: 0 is required
  # for turbo to compute the affected diff against the base ref.
  # Runs in PARALLEL with the `eslint` job below (no `needs` between them).
  # ──────────────────────────────────────────────────────────────────────
  fast-gate:
    name: Fast Gate (oxlint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: ⚡ oxlint (fast pass, turbo-affected)
        run: npx turbo run lint:oxlint --affected --output-logs errors-only

      - name: 📐 Prettier format check
        run: npm run ci:format

  # ──────────────────────────────────────────────────────────────────────
  # ESLint deep pass — its OWN job, runs in PARALLEL with the oxlint Fast
  # Gate (no `needs`, neither blocks the other). Whole-repo `eslint .`:
  # the flat config is path-tiered (severity depends on root-relative
  # paths), so per-package `eslint src/` scoping would mis-tier files and
  # surface false errors — hence eslint is NOT turbo-affected-scoped here.
  # See report / commit message for the limitation.
  # ──────────────────────────────────────────────────────────────────────
  eslint:
    name: ESLint (deep pass)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 ESLint
        run: npm run ci:lint

  # ──────────────────────────────────────────────────────────────────────
  # Deep gate — TypeScript + tests + build
  # Runs per Node version, waits for fast-gate (fail-fast economics).
  # ESLint has moved to its own parallel `eslint` job above.
  # ──────────────────────────────────────────────────────────────────────
  ci:
    name: CI (Node ${{ matrix.node-version }})
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24 — root tooling (turbo/vitest/etc) and engines.node=24.x
        # with engine-strict=true require it. Cross-version support for the
        # *published* plugins themselves is verified in their per-package
        # release tests, not the monorepo CI matrix.
        node-version: [24]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if changes are docs-only
        id: docs_only
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
          DOCS_ONLY=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if ! [[ "$file" =~ ^docs/ || "$file" =~ \.md$ || "$file" =~ README || "$file" =~ CHANGELOG ]]; then
              DOCS_ONLY=false
              break
            fi
          done <<< "$CHANGED_FILES"
          if [[ "$DOCS_ONLY" == "true" && -n "$CHANGED_FILES" ]]; then
            echo "docs_only=true" >> $GITHUB_OUTPUT
          else
            echo "docs_only=false" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Skip CI for docs-only changes
        if: steps.docs_only.outputs.docs_only == 'true'
        run: echo "✅ CI passed — only documentation files were changed"

      - name: ⚙️ Setup Node.js
        if: steps.docs_only.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        if: steps.docs_only.outputs.docs_only != 'true'
        run: npm ci

      - name: 🗄️ Restore Turbo cache
        if: steps.docs_only.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: 🔨 Build
        if: steps.docs_only.outputs.docs_only != 'true'
        run: npx turbo run build --output-logs errors-only

      - name: 🧪 Test
        if: steps.docs_only.outputs.docs_only != 'true'
        run: npx turbo run test --output-logs errors-only

      - name: 🔍 Typecheck
        if: steps.docs_only.outputs.docs_only != 'true'
        run: npx turbo run typecheck --output-logs errors-only

      - name: 📊 CI Summary
        if: always() && steps.docs_only.outputs.docs_only != 'true'
        run: |
          echo "## 📊 CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Node:** $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **npm:** $(npm --version)" >> $GITHUB_STEP_SUMMARY
