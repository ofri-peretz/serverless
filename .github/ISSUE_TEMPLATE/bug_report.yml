name: Bug Report
description: Report a bug in an @interlace/serverless-* package
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@interlace/serverless-devkit"
        - "@interlace/serverless-plugin-openapi"
        - "@interlace/serverless-plugin-package"
        - "@interlace/serverless-plugin-proxy"
        - "@interlace/serverless-plugin-build-layers"
        - "@interlace/serverless-plugin-throttling"
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: "1.0.0"
  - type: input
    id: serverless-version
    attributes:
      label: Serverless Framework Version
      placeholder: "4.30.0"
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "24.x"
