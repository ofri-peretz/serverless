# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ─────────────────────────────────────────────────────────────────────────
  # NPM dependencies — grouped per ecosystem area to avoid PR noise.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      # All dev/runtime deps in a single weekly PR — keeps merges atomic.
      all-packages:
        patterns:
          - '*'
      # Group Turborepo packages together
      turbo:
        patterns:
          - 'turbo'
          - 'eslint-config-turbo'
      # Group changesets together
      changesets:
        patterns:
          - '@changesets/*'
      # Group TypeScript ESLint together
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      # Group the Vitest universe
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
      # Group Vite + dts plugin
      build-tools:
        patterns:
          - 'vite'
          - 'vite-plugin-*'
          - '@vitejs/*'
          - 'tslib'
      # Group Fumadocs + Next together (docs site)
      docs:
        patterns:
          - 'fumadocs-*'
          - '@fumadocs/*'
          - 'next'
          - '@next/*'
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'tailwindcss'
          - '@tailwindcss/*'

  # ─────────────────────────────────────────────────────────────────────────
  # GitHub Actions — single weekly grouped PR for action versions.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    groups:
      all-actions:
        patterns:
          - '*'
