# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ─────────────────────────────────────────────────────────────────────────
  # NPM dependencies — grouped per ecosystem area to avoid PR noise.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Minor/patch dev/runtime deps in a single weekly PR — safe to batch.
      # Majors (breaking-by-convention) are excluded so each opens its own PR
      # and gets evaluated on its own merits instead of riding along silently.
      all-packages:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
      # Group Turborepo packages together (minor/patch only, see above)
      turbo:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'turbo'
          - 'eslint-config-turbo'
      # Group changesets together (minor/patch only, see above)
      changesets:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '@changesets/*'
      # Group TypeScript ESLint together (minor/patch only, see above)
      typescript-eslint:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      # Group the Vitest universe (minor/patch only, see above)
      testing:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
      # Group Vite + dts plugin (minor/patch only, see above)
      build-tools:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'vite'
          - 'vite-plugin-*'
          - '@vitejs/*'
          - 'tslib'
      # Group Fumadocs + Next together (docs site) (minor/patch only, see above)
      docs:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'fumadocs-*'
          - '@fumadocs/*'
          - 'next'
          - '@next/*'
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'tailwindcss'
          - '@tailwindcss/*'

  # ─────────────────────────────────────────────────────────────────────────
  # GitHub Actions — single weekly grouped PR for action versions.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      all-actions:
        patterns:
          - '*'
