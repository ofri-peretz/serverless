service: compare-caching
frameworkVersion: '3'
plugins:
  localPath: '@TREE@/packages'
  modules:
    - serverless-api-gateway-caching
provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  versionFunctions: false
custom:
  interlaceCaching:
    enabled: true
    clusterSize: '0.5'
    ttlInSeconds: 300
    dataEncrypted: true
functions:
  read:
    handler: handler.read
    events:
      - http:
          path: /items/{id}
          method: get
          caching:
            enabled: true
            ttlInSeconds: 60
            cacheKeyParameters:
              - name: request.path.id
              - name: request.header.Accept-Language
  write:
    handler: handler.write
    events:
      - http:
          path: /items
          method: post
