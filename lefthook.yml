# Git hooks. The stations come from the hookset presets (burgee packages/hookset), pinned by tag:
# bump `ref` to take a new preset version. `hookset check` (CI, hooks.yml) fails on a missing
# station, an unpinned ref, or a step here that repeats one a preset runs.
#
#   commit-msg  commitlint
#   pre-commit  npm run hook:staged -- <staged files>   prettier + eslint on the staged files only
#   pre-push    npm run hook:verify                     typecheck, test and build, affected vs origin/main
remotes:
  - git_url: https://github.com/ofri-peretz/burgee
    ref: hookset@0.3.0
    configs:
      - packages/hookset/presets/lefthook/commit-msg.yml
      - packages/hookset/presets/lefthook/pre-commit.yml
      - packages/hookset/presets/lefthook/pre-push.yml

# provedone, enforced today: a commit message needs a `Verified-by:` trailer. hookset@0.4.0's
# commit-msg preset runs this same `hook:provedone` station; when the ref moves to it, delete this
# local step (`hookset check` flags it as a duplicate).
commit-msg:
  commands:
    provedone:
      run: npm run --silent hook:provedone -- {1}
      fail_text: 'add a `Verified-by: <command> -> exit 0` (or `Verified-by: none (<reason>)`) trailer'
